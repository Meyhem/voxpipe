[project]
name = "voxpipe"
version = "0.1.0"
description = "Real-time voice effects into a PipeWire virtual microphone"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jsonschema>=4.22",
    "cma>=4.5.0",
]

[project.scripts]
voxpipe = "voxpipe.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxpipe"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is left to `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Could not import matplotlib"]
